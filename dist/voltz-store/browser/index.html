  <style>
    .app-loading {
      position:fixed;inset:0;background:#070d1c;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
      font-family:'Inter',sans-serif;
    }
    .app-loading-logo {
      width:52px;height:52px;border-radius:14px;
      background:linear-gradient(135deg,#1d5bd6,#173d8c);
      display:flex;align-items:center;justify-content:center;
      font-size:1.5rem;font-weight:800;color:#fff;font-family:Sora,Inter,sans-serif;
    }
    .app-loading-spinner {
      width:28px;height:28px;border-radius:50%;
      border:2.5px solid rgba(58,111,240,.2);
      border-top-color:#3a6ff0;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg) } }
